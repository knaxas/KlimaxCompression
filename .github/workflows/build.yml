name: Build KlimaxCompression.exe

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: build.bat ci
      - uses: actions/upload-artifact@v4
        with:
          name: KlimaxCompression
          path: KlimaxCompression.exe
